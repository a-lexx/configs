### Variables
# Logo key. Use Mod1 for Alt.
set $mod Mod4
set $alt Alt

# Home row direction keys, like vim
set $left h
set $down j
set $up k
set $right l

# Your preferred terminal emulator
set $term alacritty

# Your preferred application launcher
set $menu exec alacritty --class Launcher -e sway-launcher-desktop

# File manager
set $filemanager exec pcmanfm

### Fonts and layout
# Font for window titles
font pango:monospace, FontAwesome, 10

# Titles
title_align center

# Default Layout
workspace_layout tabbed

### Mouse
# Drag floating windows by holding down $mod and left mouse button.
# Resize them with right mouse button + $mod.
# Despite the name, also works for non-floating windows.
floating_modifier $mod normal

# Focus window when mouse hovers it
focus_follows_mouse yes

# Do not move the mouse to the newly focused window
mouse_warping none

# Hide mouse cursor after 5 seconds of inactivity
seat * hide_cursor 5000

### Idle
# swayidle itself runs as ~/.config/systemd/user/swayidle.service
# Do not lock or blank the screen while a window is fullscreen
for_window [class="^.*"] inhibit_idle fullscreen
for_window [app_id="^.*"] inhibit_idle fullscreen

### Lid
# logind ignores the lid (HandleLidSwitch=ignore), so turn the laptop screen off here
bindswitch --reload --locked lid:on output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable
